# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-v1.json

# WINE for Pro Audio
# WINE itself comes from the patrickl/wine-staging-dev COPR repo
# It includes patches for d2d1, which is _very nice_ for audio production.

---
type: dnf
repos:
  copr:
    - patrickl/wine-staging-dev
install:
  packages:
    - boost
    - cabextract
    - libnghttp3
    - mingw32-wine-gecko
    - mingw64-wine-gecko
    - bitstream-vera-fonts-all
    - dejavu-fonts-all
    - liberation-narrow-fonts
    - yaml-cpp
    - repo: copr:copr.fedorainfracloud.org:patrickl:wine-staging-dev
      packages:
        - libcurl-gnutls
        - pipeasio
        - wine
        - wine-dxvk
        - wine-mono
        - winetricks
        - yabridge
        - yabridge-tui
...
