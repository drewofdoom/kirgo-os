# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-v1.json
---
type: dnf
repos:
  files:
    - "https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo"
  copr:
   - c0mpile/builds
  keys:
    - https://repos.fyralabs.com/terra44/key.asc
install:
  packages:
    # noctalia.dev
    # Umbriel (Window Manager), Noctalia (Shell), and greeter
    - umbriel-git
    - xdg-desktop-portal-umbriel-git
    - noctalia
    - noctalia-greeter

    # Utilities
    - podman-compose
    - podman-machine
    - podman-tui
    - vulkan-tools
    - ntsync-autoload
    - https://github.com/knightinfected/PipeWireController/releases/download/v0.6.3/pipewire-control-center-0.6.3-1.fc44.noarch.rpm

    # Terminal
    - ghostty
    - ghostty-fish-completion
    - ghostty-nautilus
    - ghostty-shell-integration
    - ghostty-terminfo

    # Desktop
    - bibata-cursor-theme
    - arrpc
    - zen-browser
remove:
  auto-remove: true
  packages:
    - epiphany-runtime
    - evolution-data-server
    - evolution-ews-core
    - evolution-ews-langpacks
    - gdm
    - gnome-bluetooth
    - gnome-color-manager
    - gnome-control-center
    - gnome-disk-utility
    - gnome-initial-setup
    - gnome-online-accounts
    - gnome-online-accounts-libs
    - gnome-remote-desktop
    - gnome-session
    - gnome-session-wayland-session
    - gnome-shell
    - gnome-shell-extension-apps-menu
    - gnome-shell-extension-common
    - gnome-shell-extension-launch-new-instance
    - gnome-shell-extension-places-menu
    - gnome-shell-extension-window-list
    - gnome-tour
    - gnome-user-docs
    - mutter
    - orca
    - ptyxis
    - rygel
...
