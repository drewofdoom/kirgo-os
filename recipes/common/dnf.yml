# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-latest.json
---
type: dnf
repos:
  files:
    - "https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo"
  copr:
    - patrickl/wine-staging-dev
  keys:
    - https://repos.fyralabs.com/terra44/key.asc
install:
  exclude:
    - swaylock
    - alacritty
    - fuzzel
    - waybar
  packages:
    # noctalia.dev
    - umbriel-nightly
    - noctalia
    - noctalia-greeter
    - xwayland-run
    - xwayland-satellite
    # Utilities
    - nautilus
    - podman-compose
    - podman-machine
    - podman-tui
    - VK_hdr_layer
    - vulkan-tools
    - zed
    # Cursor theme (bundles all Bibata variants; active one is selected via
    # org.gnome.desktop.interface cursor-theme, currently Bibata-Modern-Ice)
    - bibata-cursor-theme
    # Terminal
    - ghostty
    - ghostty-fish-completion
    - ghostty-nautilus
    - ghostty-shell-integration
    - ghostty-terminfo
    # WINE for Pro Audio
    - libcurl-gnutls
    - pipeasio
    - wine
    - wine-dxvk
    - wine-mono
    - winetricks
    - yabridge
    - yabridge-tui
    # Misc
    - pipewire
    - wireplumber
    - pipewire-pulseaudio
remove:
  auto-remove: true
  packages:
    - epiphany-runtime
    - evolution-data-server
    - evolution-ews-core
    - evolution-ews-langpacks
    - gdm
    - gnome-bluetooth
    - gnome-color-manager
    - gnome-control-center
    - gnome-disk-utility
    - gnome-initial-setup
    - gnome-online-accounts
    - gnome-online-accounts-libs
    - gnome-remote-desktop
    - gnome-session
    - gnome-session-wayland-session
    - gnome-shell
    - gnome-shell-extension-apps-menu
    - gnome-shell-extension-common
    - gnome-shell-extension-launch-new-instance
    - gnome-shell-extension-places-menu
    - gnome-shell-extension-window-list
    - gnome-tour
    - gnome-user-docs
    - mutter
    - orca
    - ptyxis
    - rygel
...
