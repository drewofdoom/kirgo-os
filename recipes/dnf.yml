# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-v1.json
---
type: dnf
repos:
  files:
    - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
  keys:
    - https://repos.fyralabs.com/terra45/key.asc
    - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
  cleanup: true
remove:
  auto-remove: true
  packages:
    # NEW: Remove the proprietary AAC codec that blocks 32-bit Steam libraries
    - libfdk-aac
install:
  packages:
    # noctalia.dev
    # Umbriel (Window Manager), Noctalia (Shell), and greeter
    - noctalia
    - noctalia-greeter
    - umbriel-nightly
    - xdg-desktop-portal-umbriel-nightly

    # Secrets management
    - git-credential-oo7
    - gnome-keyring
    - oo7-daemon
    - oo7-portal
    - oo7-cli
    - pam_oo7

    # Containers
    - podman-compose
    - podman-machine
    - podman-tui

    # Utilities
    - ntsync-autoload
    - powertop
    - rclone
    - restic
    - tailscale
    - vulkan-tools
    - uupd
    - https://github.com/knightinfected/PipeWireController/releases/download/v0.6.3/pipewire-control-center-0.6.3-1.fc44.noarch.rpm

    # Terminal
    - fastfetch
    - ghostty
    - ghostty-fish-completion
    - ghostty-nautilus
    - ghostty-shell-integration
    - ghostty-terminfo
    - glow

    # Desktop essentials
    - adw-gtk3-theme
    - adwaita-fonts-all
    - bibata-cursor-theme
    - google-noto-mono-fonts
    - google-noto-sans-fonts
    - fdk-aac-free
    - nautilus
    - zsync

    # Desktop
    - brave-browser
    - zen-browser

    # Chat
    - vesktop

    # Gaming
    - gamescope
    - steam
...
