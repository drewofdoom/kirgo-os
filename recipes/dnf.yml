# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-v1.json
---
type: dnf
repos:
  copr:
    - imput/helium
  files:
    - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
  keys:
    - https://repos.fyralabs.com/terra45/key.asc
  cleanup: true
install:
  packages:
    # noctalia.dev
    # Umbriel (Window Manager), Noctalia (Shell), and greeter
    - noctalia
    - noctalia-greeter
    - umbriel-nightly
    - xdg-desktop-portal-umbriel-nightly

    # Secrets management
    - git-credential-oo7
    - oo7-daemon
    - oo7-portal
    - oo7-cli
    - pam_oo7

    # Containers
    - podman-compose
    - podman-machine
    - podman-tui

    # Utilities
    - ntsync-autoload
    - powertop
    - rclone
    - restic
    - tailscale
    - vulkan-tools
    - uupd
    - https://github.com/knightinfected/PipeWireController/releases/download/v0.6.3/pipewire-control-center-0.6.3-1.fc44.noarch.rpm

    # Terminal
    - fastfetch
    - ghostty
    - ghostty-fish-completion
    - ghostty-nautilus
    - ghostty-shell-integration
    - ghostty-terminfo
    - glow

    # Desktop essentials
    - adw-gtk3-theme
    - adwaita-fonts-all
    - bibata-cursor-theme
    - google-noto-mono-fonts
    - google-noto-sans-fonts
    - nautilus
    - zsync

    # Desktop
    - vesktop
    - helium-bin
remove:
  packages:
    - firefox
...
