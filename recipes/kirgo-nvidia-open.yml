# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: kirgo-nvidia-open
description: Kirgo OS with nvidia-open drivers

base-image: ghcr.io/blue-build/base-images/fedora-base-nvidia-open
image-version: latest

labels:
  org.opencontainers.image.description: Kirgo OS

modules:
  - from-file: kargs.yml
  - from-file: dnf.yml
  - type: brew
    nofile-limits: true
  - from-file: files.yml
  - from-file: systemd.yml

  # Nvidia-specific
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      keys:
        - https://repos.fyralabs.com/terra45/key.asc
      cleanup: true
    install:
      allow-erasing: true
      packages:
        - gamemode
        - gamescope
        - mangohud
        - steam
  - type: os-release
    properties:
      ID: kirgo
      NAME: Kirgo
      PRETTY_NAME: Kirgo
      VARIANT_ID: kirgo-nvidia-open
      IMAGE_ID: kirgo-nvidia-open
      DEFAULT_HOSTNAME: kirgo
      HOME_URL: https://github.com/drewofdoom/kirgo-os
      DOCUMENTATION_URL: https://github.com/drewofdoom/kirgo-os
      SUPPORT_URL: https://github.com/drewofdoom/kirgo-os/issues/
      BUG_REPORT_URL: https://github.com/drewofdoom/kirgo-os/issues/

  - type: signing
...
