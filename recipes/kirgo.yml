# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: kirgo
description: Kirgo OS

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

labels:
  org.opencontainers.image.description: Kirgo OS

modules:
  - from-file: common/files.yml
  - from-file: common/kargs.yml
  - from-file: common/dnf.yml
  - type: brew
    nofile-limits: true
  - from-file: common/systemd.yml
  - type: os-release
    properties:
      ID: kirgo
      NAME: Kirgo
      PRETTY_NAME: Kirgo
      VARIANT_ID: kirgo
      IMAGE_ID: kirgo
      DEFAULT_HOSTNAME: kirgo
      HOME_URL: https://github.com/drewofdoom/kirgo-os
      DOCUMENTATION_URL: https://github.com/drewofdoom/kirgo-os
      SUPPORT_URL: https://github.com/drewofdoom/kirgo-os/issues/
      BUG_REPORT_URL: https://github.com/drewofdoom/kirgo-os/issues/

  - type: signing
...
