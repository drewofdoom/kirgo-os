# GTK 3 settings for kirgo-os
# Noctalia will generate ~/.config/gtk-3.0/noctalia.css with the theme
# This file tells GTK to use the noctalia theme

[Settings]
# Use Adwaita as the base theme (noctalia CSS will override)
gtk-theme-name = Adwaita
gtk-icon-theme-name = Papirus-Dark
gtk-font-name = Inter 10
gtk-cursor-theme-name = Bibata-Original-Classic
gtk-cursor-theme-size = 22

# Dark mode preference
gtk-application-prefer-dark-theme = true

# Enable client-side decorations
gtk-decoration-layout = close,minimize,maximize:

# Button images
gtk-button-images = true
gtk-menu-images = true

# Tooltip timeout
gtk-enable-tooltips = true
gtk-tooltip-timeout = 100

# Animations
gtk-enable-animations = true
gtk-dialogs-use-header = true

# File chooser
gtk-file-chooser-backend = portal

# Font antialiasing
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight
gtk-xft-rgba = rgb

# Sound
gtk-sound-theme-name = freedesktop
gtk-enable-event-sounds = true
gtk-enable-input-feedback-sounds = true

# Module (for theme loading)
gtk-modules = colorreload-gtk-module

# Primary button warps slider
gtk-primary-button-warps-slider = false
